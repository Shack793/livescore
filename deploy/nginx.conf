# /etc/nginx/sites-available/livescorenow  (setup.sh fills in SERVER_NAMES and APP_PORT)
# Rate-limit zones (the app also limits; this protects it before requests reach Node)
limit_req_zone $binary_remote_addr zone=lsn_pages:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=lsn_go:10m rate=5r/s;

upstream lsn_app { server 127.0.0.1:APP_PORT; keepalive 32; }

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAMES;

    # Behind Cloudflare? Uncomment and list Cloudflare's ranges (https://www.cloudflare.com/ips/) so the real visitor IP is used:
    # set_real_ip_from 173.245.48.0/20;  ...  real_ip_header CF-Connecting-IP;

    client_max_body_size 1m;

    location / {
        limit_req zone=lsn_pages burst=60 nodelay;
        proxy_pass http://lsn_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # IMPORTANT: overwrite (not append) so visitors cannot spoof their country by sending their own X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /go/ {
        limit_req zone=lsn_go burst=10 nodelay;
        proxy_pass http://lsn_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Live scores/odds stream (Server-Sent Events): must NOT be buffered and needs a long timeout.
    location /api/stream {
        proxy_pass http://lsn_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /assets/ {
        proxy_pass http://lsn_app;
        proxy_set_header Host $host;
        expires 1d;
    }

    # Optional: restrict the admin panel to your own IP
    # location /admin { allow 203.0.113.10; deny all; proxy_pass http://lsn_app; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
}
